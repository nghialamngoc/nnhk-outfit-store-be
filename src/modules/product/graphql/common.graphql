scalar Date

type Product {
  id: ID!
  name: String!
  slug: String!
  description: String
  basePrice: Float!
  images: [String!]
  variants: [ProductVariant!]
  tags: [String!]
  status: String
  createdAt: Date
  updatedAt: Date
}

type ProductVariant {
  id: ID!
  sku: String!
  price: Float!
  discountPrice: Float
  stockQuantity: Int!
  options: [ProductOption!]
  image: String
  status: String
  createdAt: Date
  updatedAt: Date
}

type ProductOption {
  name: String!
  value: String!
}

input ProductOptionInput {
  name: String!
  value: String!
}

input ProductVariantInput {
  sku: String!
  price: Float!
  discountPrice: Float
  stockQuantity: Int!
  image: String
  status: String
  options: [ProductOptionInput!]
}

input CreateProductInput {
  name: String!
  slug: String!
  description: String
  basePrice: Float!
  images: [String!]
  variants: [ProductVariantInput!]
  tags: [String!]
  status: String
}

input UpdateProductInput {
  id: ID!
  name: String
  slug: String
  description: String
  basePrice: Float
  images: [String!]
  variants: [ProductVariantInput!]
  tags: [String!]
  status: String
}

type ProductConnection {
  products: [Product!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

type PageInfo {
  currentPage: Int!
  totalPages: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

input GetProductsInput {
  page: Int!
  limit: Int!
  sortBy: String
  sortOrder: String
  ids: [ID!]
}
